<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Faces & Places - Настройки</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Settings list items - matching card.html style */
    .settings-list-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px solid var(--glass-border-light);
      text-decoration: none;
      color: inherit;
      transition: background var(--transition-fast);
    }
    .settings-list-item:first-child {
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .settings-list-item:last-child {
      border-bottom: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .settings-list-item:only-child {
      border-radius: var(--radius-lg);
    }
    .settings-list-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .settings-list-content {
      flex: 1;
    }
    .settings-list-content .title {
      font-weight: 500;
    }
    .settings-list-content .subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .settings-list-action {
      color: var(--color-text-muted);
    }
    a.settings-list-item:hover {
      background: var(--glass-bg);
    }
  </style>
</head>
<body>
  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page">
    <div class="container">

      <!-- Header -->
      <header class="page-header">
        <a href="index.html" class="back-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>Назад</span>
        </a>
      </header>

      <div class="page-content">

        <!-- Profile Section -->
        <section class="section">
          <h1 class="heading-3 mb-lg">Настройки</h1>

          <div class="glass glass-strong p-lg mb-lg">
            <div class="flex items-center gap-md">
              <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 600; box-shadow: var(--glow-primary);">
                А
              </div>
              <div class="flex-1">
                <h3 class="heading-4">Алексей Иванов</h3>
                <p class="text-muted text-sm">alexey@email.com</p>
              </div>
              <button class="btn btn-ghost btn-icon-sm">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                  <path d="m15 5 4 4"/>
                </svg>
              </button>
            </div>
          </div>
        </section>

        <!-- Preferences Section -->
        <section class="section">
          <h2 class="section-title mb-md">Предпочтения</h2>

          <div class="glass">
            <!-- Interests -->
            <a href="preferences.html" class="settings-list-item">
              <div class="settings-list-icon" style="background: rgba(167, 139, 250, 0.2); color: var(--color-accent-purple);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
              </div>
              <div class="settings-list-content">
                <div class="title">Интересы</div>
                <div class="subtitle">Настройте уровень интереса к категориям</div>
              </div>
              <div class="settings-list-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
            </a>
          </div>
        </section>

        <!-- Notifications Section -->
        <section class="section">
          <h2 class="section-title mb-md">Уведомления</h2>

          <div class="glass">
            <div class="settings-list-item">
              <div class="settings-list-content">
                <div class="title">Email-рассылка</div>
                <div class="subtitle">Еженедельные подборки</div>
              </div>
              <div class="settings-list-action">
                <div class="toggle"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Other -->
        <section class="section">
          <h2 class="section-title mb-md">Другое</h2>

          <div class="glass">
            <a href="#" class="settings-list-item">
              <div class="settings-list-icon" style="background: var(--glass-bg-strong);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
              <div class="settings-list-content">
                <div class="title">Помощь</div>
              </div>
              <div class="settings-list-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
            </a>

            <a href="#" class="settings-list-item">
              <div class="settings-list-icon" style="background: var(--glass-bg-strong);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                  <polyline points="10 9 9 9 8 9"/>
                </svg>
              </div>
              <div class="settings-list-content">
                <div class="title">Условия использования</div>
              </div>
              <div class="settings-list-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
            </a>

            <a href="#" class="settings-list-item">
              <div class="settings-list-icon" style="background: var(--glass-bg-strong);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <div class="settings-list-content">
                <div class="title">Политика конфиденциальности</div>
              </div>
              <div class="settings-list-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
            </a>
          </div>
        </section>

        <!-- Logout -->
        <section class="section">
          <button class="btn btn-secondary btn-full" style="color: var(--color-accent-primary);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Выйти из аккаунта
          </button>
        </section>

        <!-- App version -->
        <p class="text-center text-muted text-sm mt-lg mb-lg">
          Версия 1.0.0
        </p>

      </div>
    </div>
  </div>
  <script>
    // Toggle switch functionality
    document.querySelectorAll('.toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
      });
    });
  </script>
</body>
</html>
