<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Faces & Places</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Dev banner for non-Telegram environments */
    .dev-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: linear-gradient(90deg, #ff6b9d, #4ecdc4);
      color: white;
      text-align: center;
      padding: 4px 12px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }
    .dev-banner + .bg-orbs + .page {
      padding-top: 28px;
    }

    /* Loading states */
    .skeleton {
      background: linear-gradient(90deg, var(--glass-bg) 25%, var(--glass-bg-strong) 50%, var(--glass-bg) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: var(--radius-md);
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Error state */
    .error-state {
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .error-state svg {
      margin-bottom: var(--space-md);
      opacity: 0.5;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .empty-state svg {
      margin-bottom: var(--space-md);
      opacity: 0.5;
    }

    /* Like button animation */
    .card-favorite {
      position: relative;
      overflow: visible;
    }
    .card-favorite.liked {
      background: var(--color-accent-primary) !important;
      color: white !important;
      box-shadow: var(--glow-primary);
    }
    .card-favorite.liked svg {
      fill: currentColor;
    }
    .like-particles {
      position: absolute;
      top: 50%;
      left: 50%;
      pointer-events: none;
    }
    .like-particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent-primary);
      animation: particle-burst 0.6s ease-out forwards;
    }
    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* Card removal animation */
    .card.removing {
      animation: card-remove 0.4s ease-out forwards;
    }
    @keyframes card-remove {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); height: 0; margin: 0; padding: 0; }
    }

    /* Card hero & gallery (for event detail page) */
    .card-hero {
      position: relative;
      height: 300px;
      margin: 0 calc(var(--space-md) * -1);
      overflow: hidden;
    }
    .gallery-container { width: 100%; height: 100%; position: relative; }
    .gallery-track { display: flex; height: 100%; transition: transform 0.3s ease; }
    .gallery-slide {
      min-width: 100%; height: 100%;
      position: relative; cursor: pointer;
    }
    .card-hero-overlay {
      position: absolute; top: 0; left: 0; right: 0;
      padding: var(--space-md);
      display: flex; justify-content: space-between; align-items: flex-start;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
      z-index: 10;
    }
    .card-hero-actions { display: flex; gap: var(--space-sm); }
    .gallery-dots {
      position: absolute; bottom: var(--space-md); left: 50%; transform: translateX(-50%);
      display: flex; gap: var(--space-xs); z-index: 10;
    }
    .gallery-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(4px); transition: all var(--transition-fast); cursor: pointer;
    }
    .gallery-dot.active { background: white; width: 24px; border-radius: 4px; }
    .price-tag { font-size: 1.5rem; font-weight: 700; color: var(--color-accent-secondary); }
    .price-label { font-size: 0.875rem; color: var(--color-text-muted); }
    .info-list-item {
      display: flex; align-items: center; gap: var(--space-md);
      padding: var(--space-md); border-bottom: 1px solid var(--glass-border-light);
    }
    .info-list-item:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .info-list-item:last-child { border-bottom: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .info-list-icon {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .info-list-content { flex: 1; }

    /* Like btn on detail page */
    .like-btn { position: relative; transition: all var(--transition-fast); }
    .like-btn.liked {
      background: var(--color-accent-primary); color: white;
      box-shadow: var(--glow-primary);
    }
    .like-btn .heart-particles { position: absolute; top: 50%; left: 50%; pointer-events: none; }
    .like-btn .heart-particle {
      position: absolute; font-size: 12px; opacity: 0; transform: translate(-50%, -50%);
    }
    .like-btn.animating .heart-particle { animation: heartBurst 0.6s ease-out forwards; }
    @keyframes heartBurst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1); }
    }
    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .like-btn.animating svg { animation: heartPop 0.3s ease; }

    /* Date picker styles */
    .date-picker-compact {
      display: flex; gap: var(--space-sm); overflow-x: auto;
      margin: 0 calc(var(--space-md) * -1); padding: 0 var(--space-md) var(--space-sm);
      scrollbar-width: none;
    }
    .date-picker-compact::-webkit-scrollbar { display: none; }
    .date-item {
      display: flex; flex-direction: column; align-items: center;
      padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      cursor: pointer; transition: all var(--transition-fast); flex-shrink: 0; min-width: 60px;
    }
    .date-item:hover { background: var(--glass-bg-strong); }
    .date-item.selected { background: var(--gradient-primary); border-color: transparent; color: white; }
    .date-item-day { font-size: var(--font-size-xs); opacity: 0.7; margin-bottom: 2px; }
    .date-item-date { font-size: var(--font-size-lg); font-weight: 600; }
    .date-item-month { font-size: var(--font-size-xs); opacity: 0.7; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
